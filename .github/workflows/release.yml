name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04

    steps:
      - name: Resolve release commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Enforce 2.0 release evidence
        shell: bash
        run: |
          if [[ "$(tr -d '[:space:]' < VERSION)" == "2.0.0" ]]; then
            python scripts/release_readiness.py release-evidence-2.0.json
          fi

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for 2.0 quality and supply-chain gates
        if: steps.version.outputs.version == '2.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for WORKFLOW in "Code Quality" "Supply Chain Security"; do
            OK=0
            for _ in $(seq 1 90); do
              RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"
              STATUS="$(jq -r --arg name "$WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | .status // ""' <<<"$RUNS")"
              CONCLUSION="$(jq -r --arg name "$WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | .conclusion // ""' <<<"$RUNS")"
              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "$WORKFLOW failed for $TARGET_SHA: $CONCLUSION" >&2
                  exit 1
                fi
                OK=1
                break
              fi
              sleep 20
            done
            if [[ "$OK" != "1" ]]; then
              echo "Timed out waiting for $WORKFLOW on $TARGET_SHA" >&2
              exit 1
            fi
          done

      - name: Verify release notes source
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="releases/v${VERSION}.md"
          if [[ -s "$NOTES_FILE" ]]; then
            echo "Using $NOTES_FILE"
            exit 0
          fi
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || {
            echo "No release notes file or CHANGELOG.md entry for ${VERSION}" >&2
            exit 1
          }

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="releases/v${VERSION}.md"
          if [[ -s "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" RELEASE_NOTES.md
          else
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" {capture=1}
              capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" {exit}
              capture {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md

      - name: Create tag and GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "OpenCode Bridge $TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "$TARGET_SHA"
