name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release notes source
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="releases/v${VERSION}.md"
          if [[ -s "$NOTES_FILE" ]]; then
            echo "Using $NOTES_FILE"
            exit 0
          fi
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || {
            echo "No release notes file or CHANGELOG.md entry for ${VERSION}" >&2
            exit 1
          }

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="releases/v${VERSION}.md"
          if [[ -s "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" RELEASE_NOTES.md
          else
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" {capture=1}
              capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" {exit}
              capture {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md

      - name: Create tag and GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "OpenCode Bridge $TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "$TARGET_SHA"
