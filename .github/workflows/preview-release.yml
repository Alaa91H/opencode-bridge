name: Preview Release

on:
  push:
    branches:
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-release
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate preview version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^2\.0\.0-rc\.[0-9]+$ ]] || {
            echo "Preview version must match 2.0.0-rc.N" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install locked runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock -c constraints.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run full unit suite
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate configuration and shell
        run: |
          python -m json.tool opencode.json >/dev/null
          bash -n start.sh
          for file in maintenance/*.sh; do bash -n "$file"; done

      - name: Verify release notes
        run: test -s "releases/v${{ steps.version.outputs.version }}.md"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --prerelease \
            --title "OpenCode Bridge $TAG (Preview)" \
            --notes-file "releases/v${VERSION}.md" \
            --target "$GITHUB_SHA"
