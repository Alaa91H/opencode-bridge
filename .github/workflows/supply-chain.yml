name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  security:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock

      - name: Secret scanning
        run: |
          python -m pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/|^tests/' > /tmp/secrets.json
          python -c "import json; d=json.load(open('/tmp/secrets.json')); assert not any(d.get('results', {}).values()), d.get('results')"

      - name: Static security analysis
        run: |
          python -m pip install bandit
          bandit -r bridge -q -lll

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Release checksum manifest
        run: sha256sum requirements.lock constraints.txt VERSION > release-checksums.txt

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: requirements.lock
          sbom-path: sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: supply-chain
          path: |
            sbom.spdx.json
            release-checksums.txt
