name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock -c constraints.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Record v2 baseline inventory
        run: python scripts/v2_baseline_probe.py --inventory-only

      - name: Run v2 baseline micro-benchmark
        run: python scripts/v2_baseline_probe.py --benchmark-only

      - name: Validate shell maintenance scripts
        run: |
          bash -n start.sh
          for file in maintenance/*.sh; do bash -n "$file"; done

      - name: Validate OpenCode configuration
        run: python -m json.tool opencode.json >/dev/null

      - name: Validate version
        run: |
          python - <<'PY'
          import pathlib
          import re

          value = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          stable = re.fullmatch(r"\d+\.\d+\.\d+", value)
          preview = re.fullmatch(r"2\.0\.0-rc\.\d+", value)
          assert stable or preview, f"VERSION must be x.y.z or 2.0.0-rc.N, got {value!r}"
          print(value)
          PY

  package:
    name: package immutable main artifact
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Package and verify exact source identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          ARTIFACT="opencode-bridge-${SOURCE_SHA}.tar.gz"
          git archive --format=tar "$SOURCE_SHA" | gzip -n > "dist/$ARTIFACT"
          python scripts/release_artifact.py create "dist/$ARTIFACT" "$VERSION" "$SOURCE_SHA" dist/manifest.json
          python scripts/release_artifact.py verify "dist/$ARTIFACT" dist/manifest.json "$SOURCE_SHA"
          (cd dist && sha256sum "$ARTIFACT" > "$ARTIFACT.sha256")

      - name: Upload immutable artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
