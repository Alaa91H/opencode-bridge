name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate shell maintenance scripts
        run: |
          bash -n start.sh
          for file in maintenance/*.sh; do bash -n "$file"; done

      - name: Validate OpenCode configuration
        run: python -m json.tool opencode.json >/dev/null

      - name: Validate V3 OpenCode configuration
        run: python -m json.tool opencode-v3.json >/dev/null

      - name: Validate version
        run: python -c "import pathlib; parts=pathlib.Path('VERSION').read_text().strip().split('.'); assert len(parts)==3 and all(p.isdigit() for p in parts); print('.'.join(parts))"
