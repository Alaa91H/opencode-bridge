name: One-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete reconciled branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/daily-autonomous-maintenance"
            "feat/free-points-header"
            "feat/telegram-muse-spark-xhigh"
            "feat/zram-half-memory"
            "feature/ai-dev-station-v3-20260914"
            "noop"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
