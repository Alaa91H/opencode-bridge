name: 2.0 Endurance Soak

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Total soak duration (24-72)"
        required: true
        default: "24"

permissions:
  contents: read
  actions: write

concurrency:
  group: opencode-bridge-2-soak
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    outputs:
      hours: ${{ steps.v.outputs.hours }}
    steps:
      - id: v
        shell: bash
        run: |
          HOURS="${{ inputs.duration_hours }}"
          python -c 'import sys; h=float(sys.argv[1]); assert 24 <= h <= 72' "$HOURS"
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"

  soak:
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run six-hour endurance shard
        shell: bash
        run: |
          python scripts/load_soak.py --tasks 10000 --schedules 500 --owners 100 --slow-ms 5 --duration-seconds 21600 > "soak-${{ matrix.shard }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.shard }}
          path: soak-${{ matrix.shard }}.txt

  evidence-note:
    needs: [validate, soak]
    runs-on: ubuntu-26.04
    steps:
      - name: Explain evidence semantics
        run: |
          echo "Four parallel six-hour shards are load evidence only."
          echo "They do NOT satisfy the required continuous 24-72h soak."
          echo "T50 remains blocked until one environment records continuous elapsed duration >=24h."
