name: Release Soak 2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-soak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-soak-2.0
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Validate release head before endurance
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/release_readiness.py release-evidence-2.0.json || true

  segment-1:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/soak_segment.py --segment 1 --output segment-1.json --duration-seconds 14700
      - uses: actions/upload-artifact@v4
        with:
          name: soak-segment-1
          path: segment-1.json
          retention-days: 7

  segment-2:
    needs: segment-1
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/soak_segment.py --segment 2 --output segment-2.json --duration-seconds 14700
      - uses: actions/upload-artifact@v4
        with:
          name: soak-segment-2
          path: segment-2.json
          retention-days: 7

  segment-3:
    needs: segment-2
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/soak_segment.py --segment 3 --output segment-3.json --duration-seconds 14700
      - uses: actions/upload-artifact@v4
        with:
          name: soak-segment-3
          path: segment-3.json
          retention-days: 7

  segment-4:
    needs: segment-3
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/soak_segment.py --segment 4 --output segment-4.json --duration-seconds 14700
      - uses: actions/upload-artifact@v4
        with:
          name: soak-segment-4
          path: segment-4.json
          retention-days: 7

  segment-5:
    needs: segment-4
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/soak_segment.py --segment 5 --output segment-5.json --duration-seconds 14700
      - uses: actions/upload-artifact@v4
        with:
          name: soak-segment-5
          path: segment-5.json
          retention-days: 7

  segment-6:
    needs: segment-5
    runs-on: ubuntu-26.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/soak_segment.py --segment 6 --output segment-6.json --duration-seconds 14700
      - uses: actions/upload-artifact@v4
        with:
          name: soak-segment-6
          path: segment-6.json
          retention-days: 7

  aggregate:
    needs: segment-6
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v5
        with:
          pattern: soak-segment-*
          path: soak-parts
          merge-multiple: true
      - name: Validate 24-72h active soak evidence
        run: python scripts/aggregate_soak.py soak-parts --output soak-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: soak-evidence-2.0
          path: soak-evidence.json
          retention-days: 30

  promote:
    needs: aggregate
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: soak-evidence-2.0

      - name: Promote evidence and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          release_path = Path("release-evidence-2.0.json")
          evidence = json.loads(release_path.read_text(encoding="utf-8"))
          soak = json.loads(Path("soak-evidence.json").read_text(encoding="utf-8"))
          if soak.get("completed") is not True or not 24 <= float(soak.get("duration_hours", 0)) <= 72:
              raise SystemExit("invalid soak evidence")
          evidence["soak"] = soak
          release_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path("VERSION").write_text("2.0.0\n", encoding="utf-8")
          PY
          python scripts/release_readiness.py release-evidence-2.0.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION release-evidence-2.0.json
          git commit -m "release(t50): promote 2.0.0 after endurance soak"
          git push origin HEAD:main
          echo "PROMOTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch final release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run quality.yml --ref main
          gh workflow run supply-chain.yml --ref main

      - name: Wait for final release gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for WORKFLOW in "CI" "Code Quality" "Supply Chain Security"; do
            OK=0
            for _ in $(seq 1 120); do
              RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PROMOTION_SHA}&per_page=100")"
              STATUS="$(jq -r --arg name "$WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | .status // ""' <<<"$RUNS")"
              CONCLUSION="$(jq -r --arg name "$WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | .conclusion // ""' <<<"$RUNS")"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]] || { echo "$WORKFLOW failed: $CONCLUSION" >&2; exit 1; }
                OK=1
                break
              fi
              sleep 15
            done
            [[ "$OK" == "1" ]] || { echo "timeout waiting for $WORKFLOW" >&2; exit 1; }
          done

      - name: Dispatch v2.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main

      - name: Wait for v2.0.0 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for _ in $(seq 1 120); do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PROMOTION_SHA}&per_page=100")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name=="Release")] | sort_by(.created_at) | last | .status // ""' <<<"$RUNS")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name=="Release")] | sort_by(.created_at) | last | .conclusion // ""' <<<"$RUNS")"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || { echo "Release failed: $CONCLUSION" >&2; exit 1; }
              OK=1
              break
            fi
            sleep 15
          done
          [[ "$OK" == "1" ]] || { echo "timeout waiting for Release" >&2; exit 1; }
          gh release view v2.0.0 >/dev/null

      - name: Close T50 execution state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/opencode-bridge-2.0-execution-state.md")
          text = path.read_text(encoding="utf-8")
          marker = "## إغلاق T50 النهائي — OpenCode Bridge 2.0"
          if marker not in text:
              text += """

          ## إغلاق T50 النهائي — OpenCode Bridge 2.0
          - [x] soak فعلي 24–72h مكتمل ومثبت في release-evidence-2.0.json.
          - [x] VERSION = 2.0.0.
          - [x] CI + Python matrix ناجحة.
          - [x] Code Quality ناجح.
          - [x] Supply Chain Security ناجح ولا توجد high/critical vulnerabilities غير مقبولة.
          - [x] migration/backup/restore/crash/schedule/duplicate/streaming/Local API/long-prompt/multi-workspace/rollback evidence مكتمل.
          - [x] tag/release v2.0.0 موجود وناجح.
          - **T50 مغلقة نهائيًا، وبذلك T00 → T50 مكتملة.**
          """
              path.write_text(text, encoding="utf-8")
          PY
          git add docs/opencode-bridge-2.0-execution-state.md
          git commit -m "docs(state): close T50 after v2.0.0 release"
          git push origin HEAD:main
