name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install quality tools
        run: python -m pip install ruff mypy vulture

      - name: Ruff critical correctness
        run: ruff check bridge --select E9,F63,F7,F82

      - name: Formatting check on v2 infrastructure
        run: ruff format --check bridge/infrastructure/tracing bridge/infrastructure/security bridge/infrastructure/deployment bridge/infrastructure/logging bridge/services/health_service.py || true

      - name: Import sorting check on v2 infrastructure
        run: ruff check bridge/infrastructure/tracing bridge/infrastructure/security bridge/infrastructure/deployment bridge/infrastructure/logging bridge/services/health_service.py --select I || true

      - name: Type-check new policy modules
        run: mypy --ignore-missing-imports bridge/infrastructure/tracing bridge/infrastructure/security bridge/services/health_service.py

      - name: Dead-code report
        run: vulture bridge --min-confidence 90 || true

      - name: Complexity report
        run: ruff check bridge --select C901 --output-format concise || true
