name: Code Quality

# Strict hygiene gate. Nothing here is advisory: a check that cannot fail the
# job is a report, not a gate, so the blocking path uses no exit-zero fallback
# operator. The "Confirm the gate has no advisory escapes" step below greps this
# workflow too, which is why this comment avoids spelling the pattern out.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene (python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -ignore 'label "ubuntu-26.04" is unknown' \
            .github/workflows/ci.yml \
            .github/workflows/deploy-production.yml \
            .github/workflows/quality.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality tools
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            ruff==0.14.4 mypy==1.14.1 vulture==2.14

      - name: Version
        run: cat VERSION

      - name: Strict lint and hygiene
        env:
          QUALITY_PYTHON: python
        run: bash scripts/quality.sh

      - name: Confirm the gate has no advisory escapes
        run: |
          if grep -nE '\|\|\s*true' scripts/quality.sh .github/workflows/quality.yml; then
            echo "advisory escape found; a check cannot fail the job" >&2
            exit 1
          fi

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          for file in start.sh scripts/*.sh maintenance/*.sh; do
            [[ -f "$file" ]] || continue
            shellcheck -S warning "$file"
          done

  release-identity:
    name: release identity is tag-bound
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy script requires a tag
        run: |
          set -euo pipefail
          script=scripts/deploy.sh
          # A deployment must never default to HEAD or accept a raw ref.
          if grep -qE 'TARGET_REF=.*HEAD' "$script"; then
            echo "deploy.sh still defaults to HEAD" >&2
            exit 1
          fi
          for required in 'RELEASE_TAG_PATTERN' 'refs/tags/' 'deployment-identity' 'VERSION'; do
            grep -q "$required" "$script" || { echo "deploy.sh missing $required" >&2; exit 1; }
          done

      - name: VERSION matches the tag on a tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "v${version}" != "$tag" ]]; then
            echo "tag ${tag} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: system units derive their stamp from the release version
        run: |
          set -euo pipefail
          grep -q 'BRIDGE_RELEASE_TAG' systemd.py
          grep -q 'def deployed_tag' systemd.py
          grep -q 'def read_version' systemd.py
