name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install -r requirements.lock -c constraints.txt
          python -m pip check

      - name: Validate syntax and configuration
        run: |
          python -m compileall -q .
          python -m json.tool opencode.json >/dev/null
          bash -n start.sh
          for file in scripts/*.sh maintenance/*.sh; do
            [[ -f "$file" ]] && bash -n "$file"
          done

      - name: Run tests
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Package development artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          git archive --format=tar.gz --output="dist/opencode-bridge-${GITHUB_SHA::12}.tar.gz" HEAD
          sha256sum dist/* > dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: opencode-bridge-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  release:
    name: Release from tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package tagged source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="opencode-bridge-${tag}/" --output="dist/opencode-bridge-${tag}.tar.gz" "${tag}"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" dist/*             --title "OpenCode Bridge $tag"             --generate-notes             --verify-tag
